[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "strongtowns-detroit"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
    "strongtowns-graphics @ git+https://github.com/Strong-Towns-Detroit/strongtowns-graphics.git@56cfd0b94d3191e88fec235bef5d47faebdebd22",
    "strongtowns-data @ git+https://github.com/Strong-Towns-Detroit/strongtowns-data.git@63b046d4b3ff70842122ab47c72c8618fba97596",
    "osmnx",
    "geopandas",
    "networkx",
    "shapely",
    "scikit-learn",
    "matplotlib",
    "pandas",
    "polars",
    "numpy",
    "pyarrow",
    "jsonschema",
    "requests",
    "python-dotenv",
    "pyogrio",
    "beautifulsoup4",
    "lxml",
    "python-docx",
    "rdflib",
    "pillow",
    "httpx",
    "duckdb>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock"]
minutes = ["google-genai", "pydantic"]
archive = ["boto3"]
census = ["pytidycensus"]
semantic = ["sentence-transformers"]
accessibility = ["r5py"]
notebooks = ["marimo>=0.18,<1"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "projects/detroit-land-use-forum",
]
pythonpath = [
    ".",
    "src",
    "pipelines/legislative-district",
]
