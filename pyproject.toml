[project]
name = "strongtowns-detroit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "osmnx",
    "geopandas",
    "networkx",
    "shapely",
    "scikit-learn",
    "matplotlib",
    "pandas",
    "polars",
    "numpy",
]

[project.scripts]
strongtowns-graphics = "strongtowns_detroit.graphics.cli:main"

[tool.setuptools.package-data]
"strongtowns_detroit.graphics" = ["assets/*.png"]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock", "python-dotenv"]
minutes = ["google-genai", "pydantic"]
archive = ["boto3"]

[tool.pytest.ini_options]
testpaths = ["tests", "pipelines/isochrones/tests"]
pythonpath = [
    "src",
    "pipelines/parcel-data",
    "pipelines/housingDataAnalysis/src",
    "pipelines/housingDataAnalysis/street_simplification",
    "pipelines/zoning",
    "pipelines/legislative-district",
    "pipelines/isochrones",
]
