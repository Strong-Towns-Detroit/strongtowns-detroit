[project]
name = "strongtowns-detroit"
version = "0.1.0"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest", "pytest-mock", "python-dotenv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src",
    "pipelines/parcel-data",
    "pipelines/housingDataAnalysis/src",
    "pipelines/housingDataAnalysis/street_simplification",
    "pipelines/zoning",
]
