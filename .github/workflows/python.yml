name: Python

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.10.4
      - run: uv sync --locked --extra dev
      - run: uv run pytest -q

  land-forum:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/land-forum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sites/land-forum/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run tokens:check
      - run: npm run build
