name: Python

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.10.4
      - run: uv sync --locked --extra dev
      - run: uv run pytest -q

  archive-restore-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.10.4
      - run: uv sync --locked --extra archive
      - name: Check whether the first R2 archive has been published
        id: archive
        run: |
          if test -f scripts/data_archive_manifest.json; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Archive smoke skipped: no committed archive manifest yet."
          fi
      - name: Restore and verify immutable source tiers
        if: steps.archive.outputs.ready == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          uv run strongtowns-data archive pull --tier critical --tier source --apply
          uv run strongtowns-data archive status --tier critical --tier source
      - name: Rebuild contract-v1 without network access
        if: steps.archive.outputs.ready == 'true'
        run: |
          uv run strongtowns-data build canonical-detroit-parcels canonical-detroit-base-units-addresses canonical-detroit-base-units-streets canonical-detroit-base-units-buildings
          uv run strongtowns-data build detroit-routing-anchors
          uv run strongtowns-data build detroit-query-catalog
          uv run strongtowns-data catalog query detroit.query.catalog --sql "SELECT count(*) AS parcels FROM parcels"
