<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zoning DSL Review Matrix</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <div class="brand-mark" aria-hidden="true"><i>★</i><i></i><i>⚜</i><i></i></div>
    <div>
      <p class="eyebrow">Strong Towns Detroit · Zoning Rule Engine</p>
      <h1>Ontology × rule syntax review</h1>
      <p class="deck">Rank the language designs independently. Compare the same ordinance statements, then judge what is semantics and what is merely syntax.</p>
    </div>
  </header>

  <main>
    <section id="summary" class="summary"></section>
    <nav class="tabs" aria-label="Review sections">
      <button class="active" data-view="rank">Rank the designs</button>
      <button data-view="examples">Examples & tests</button>
      <button data-view="matrix">Pairing matrix</button>
    </nav>
    <section id="rank-view" class="view active"></section>
    <section id="examples-view" class="view"></section>
    <section id="matrix-view" class="view"></section>
  </main>

  <footer>
    <p>Ratings remain in this browser until exported or reset.</p>
    <div class="actions">
      <button id="export">Export review JSON</button>
      <label class="button-label">Import review JSON<input id="import" type="file" accept="application/json"></label>
      <button id="reset" class="quiet">Reset ratings</button>
    </div>
  </footer>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
